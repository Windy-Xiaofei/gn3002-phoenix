name: TWRP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.mk'
      - 'twrp.fstab'
      - 'prebuilt/**'
      - '.github/workflows/**'

concurrency:
  group: twrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: dt
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install Java 8
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -qq
          sudo apt-get install -y temurin-8-jdk

          # runner 预装的是 Java 11，必须把它从 PATH 前面顶掉。
          # Android 8.1 的 build 系统会读 `java -version` 的第一行做版本判断，
          # 所以这里既设 JAVA_HOME 也改 alternatives，双保险。
          JH=$(ls -d /usr/lib/jvm/temurin-8-jdk-* 2>/dev/null | head -1)
          echo "Java 8 安装路径: $JH"
          echo "JAVA_HOME=$JH" >> $GITHUB_ENV
          echo "$JH/bin" >> $GITHUB_PATH
          sudo update-alternatives --set java  "$JH/bin/java"  2>/dev/null || true
          sudo update-alternatives --set javac "$JH/bin/javac" 2>/dev/null || true
          sudo update-alternatives --set jar   "$JH/bin/jar"   2>/dev/null || true
          "$JH/bin/java" -version

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            python3-lib2to3

          # AOSP 8.1 自带的 prebuilt clang（4053586，2017 年构建）DT_NEEDED 里
          # 写死了 libncurses.so.5 / libtinfo.so.5，而 jammy 只剩 .so.6，
          # jammy 源里也没有 libncurses5 这个包了 —— 只能从 focal 的 pool 直接装。
          # 用 6.2-0ubuntu2.1（glibc 2.31 编的），比同目录下的 6.3 那几版更保险。
          BASE=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
          cd /tmp
          curl -sSLO "$BASE/libtinfo5_6.2-0ubuntu2.1_amd64.deb"
          curl -sSLO "$BASE/libncurses5_6.2-0ubuntu2.1_amd64.deb"
          sudo dpkg -i libtinfo5_6.2-0ubuntu2.1_amd64.deb libncurses5_6.2-0ubuntu2.1_amd64.deb

          # 同理：--gcc-toolchain 指向的 gcc 4.8 prebuilt 依赖 libmpfr.so.4，
          # jammy 只有 libmpfr6（.so.6）。从 bionic 的 pool 取。
          curl -sSLO "http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb"
          sudo dpkg -i libmpfr4_3.1.4-1_amd64.deb

          sudo ldconfig
          ldconfig -p | grep -E "lib(ncurses|tinfo)\.so\.5|libmpfr\.so\.4"

      - name: repo init and sync
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir -p $GITHUB_WORKSPACE/rom
          cd $GITHUB_WORKSPACE/rom
          git config --global user.name "phoenix-ci"
          git config --global user.email "ci@phoenix.local"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
                    -b twrp-8.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h /

      - name: Place device tree
        run: |
          mkdir -p rom/device/gionee/gbl7356
          rsync -a --exclude='.git' dt/ rom/device/gionee/gbl7356/
          ls -la rom/device/gionee/gbl7356/

      - name: Patch legacy python2 scripts
        run: |
          bash rom/device/gionee/gbl7356/tools/ci-patch-tree.sh rom

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Build recovery
        run: |
          cd rom
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPRESS=1
          ccache -z || true
          # 注意：不要设 _JAVA_OPTIONS / JAVA_TOOL_OPTIONS。
          # 它们会往 `java -version` 的 stderr 里插一行 "Picked up ..."，
          # 而 8.1 的 build 系统只读第一行来判断版本，会直接判成版本错误。
          set -o pipefail
          source build/envsetup.sh
          lunch omni_gbl7356-eng
          java -version 2>&1 | head -2
          # 先验证那个 2017 年的 prebuilt clang 能起来，别等编到一半才发现缺库
          prebuilts/clang/host/linux-x86/clang-4053586/bin/clang --version | head -2
          # 体积检查失败（ramdisk 装不进 16MB 分区）不影响产物生成：
          # mkbootimg 已经跑完、ramdisk-recovery.img 完好，下一步会瘦身重打包。
          # 真正的编译错误会在下一步被 ramdisk 缺失检查拦下。
          mka recoveryimage -j$(nproc --all) 2>&1 | tee ../build.log || true
          ccache -s || true

      - name: Strip and repack recovery image
        # 保底手段：不管排除开关是否生效，都在产物层面把确定不需要的东西
        # 从 ramdisk 里拿掉，再用与 build 系统一致的参数重打镜像。
        # TeamWin recovery 默认塞进来的 python3（二进制 3.7MB + 标准库 2.5MB）
        # 是 ramdisk 最大单项；bash/tzdata 是实测会漏进来的两个。
        if: always()
        run: |
          cd rom
          D=out/target/product/gbl7356
          if [ ! -f "$D/ramdisk-recovery.img" ] || [ ! -f "$D/kernel" ]; then
            echo "::error::ramdisk-recovery.img 或 kernel 不存在 —— 编译在更早阶段就失败了"
            exit 1
          fi
          echo "=== 瘦身前 ==="
          ls -l "$D/ramdisk-recovery.img" "$D/kernel"

          rm -rf /tmp/rd && mkdir -p /tmp/rd && cd /tmp/rd
          gzip -dc "$GITHUB_WORKSPACE/rom/$D/ramdisk-recovery.img" | cpio -idm --quiet

          echo "=== 待移除项的实际体积 ==="
          du -shc sbin/python3 etc/python sbin/bash sbin/etc/bash \
                  system/usr/share/zoneinfo/tzdata sbin/mkfs.f2fs sbin/fsck.f2fs \
                  sbin/nano sbin/etc/nano 2>/dev/null || true

          rm -rf sbin/python3 etc/python sbin/bash sbin/etc/bash \
                 system/usr/share/zoneinfo/tzdata sbin/mkfs.f2fs sbin/fsck.f2fs \
                 sbin/nano sbin/etc/nano

          # find+cpio 重打包；-R 0:0 统一属主，--null 防文件名空格
          find . -print0 | cpio --null -o -H newc --quiet -R 0:0 \
            | gzip -9 > /tmp/ramdisk-stripped.img
          echo "=== 瘦身后 ==="
          ls -l /tmp/ramdisk-stripped.img

          # 与 build/make 完全一致的参数（BOARD_MKBOOTIMG_ARGS 的值也在这里）
          "$GITHUB_WORKSPACE/rom/out/host/linux-x86/bin/mkbootimg" \
            --kernel "$GITHUB_WORKSPACE/rom/$D/kernel" \
            --ramdisk /tmp/ramdisk-stripped.img \
            --cmdline "bootopt=64S3,32N2,64N2 buildvariant=eng" \
            --base 0x40000000 --pagesize 2048 \
            --kernel_offset 0x00080000 --ramdisk_offset 0x04000000 \
            --tags_offset 0x0e000000 \
            --os_version 16.1.0 --os_patch_level 2018-11-05 \
            --output "$GITHUB_WORKSPACE/rom/$D/recovery.img"

          # 与 build 系统相同的尺寸公式：分区 16MB - 2 块预留
          SIZE=$(stat -c%s "$GITHUB_WORKSPACE/rom/$D/recovery.img")
          MAX=$((16777216 - 270336))
          echo "recovery.img = $SIZE bytes, max = $MAX"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::还是太大"
            exit 1
          fi
          echo "OK: 装得下（余量 $((MAX - SIZE)) 字节）"

      - name: Inspect ramdisk contents
        if: always()
        run: |
          D=rom/out/target/product/gbl7356
          [ -d "$D" ] || exit 0
          echo "=== 镜像与内核 ==="
          ls -lh "$D"/*.img "$D/kernel" 2>/dev/null || true
          echo "=== 最终 recovery.img header 校验 ==="
          python3 - <<'EOF'
          import struct
          try:
              d = open("rom/out/target/product/gbl7356/recovery.img", "rb").read(1664)
              assert d[:8] == b"ANDROID!", "bad magic"
              ks,ka,rs,ra,ss,sa,ta,ps = struct.unpack("<8I", d[8:40])
              print("kernel  %8d 0x%08x (期望 0x40080000)" % (ks,ka))
              print("ramdisk %8d 0x%08x (期望 0x44000000)" % (rs,ra))
              print("tags    %8d 0x%08x (期望 0x4e000000)" % (ss,ta))
              print("page    %8d (期望 2048)" % ps)
              print("cmdline:", d[64:576].split(b"\0")[0].decode())
          except Exception as e:
              print("header 校验失败:", e)
          EOF
          echo "=== 谁把这些文件放进了 ramdisk（排除开关失灵的根因）==="
          grep -E "bash|python|tzdata|f2fs" "$D/recovery/root/ramdisk-files.txt" 2>/dev/null | head -25 || true
          echo "=== recovery root 各子目录（未压缩）==="
          du -sh "$D"/recovery/root/* 2>/dev/null | sort -h | tail -15 || true
          echo "=== ramdisk 里最大的 40 个文件（未压缩字节, size=第5列）==="
          gzip -dc "$D/ramdisk-recovery.img" 2>/dev/null \
            | cpio -itv 2>/dev/null \
            | awk '$5 ~ /^[0-9]+$/ {printf "%10d  %s\n", $5, $9}' \
            | sort -n | tail -40 || true

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp rom/out/target/product/gbl7356/recovery.img artifacts/ 2>/dev/null || true
          cp rom/out/target/product/gbl7356/recovery.img artifacts/twrp-gbl7356.img 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-gbl7356
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
