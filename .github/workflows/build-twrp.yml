name: TWRP

on:
  # 只保留手动触发。TWRP 已经能用了，设备树再改也不该每次都重编一遍
  # （之前 paths 里挂着 '**/*.mk'，等于每次提交都要烧 8 分钟 runner）。
  workflow_dispatch:

concurrency:
  group: twrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: dt
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install Java 8
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -qq
          sudo apt-get install -y temurin-8-jdk

          # runner 预装的是 Java 11，必须把它从 PATH 前面顶掉。
          # Android 8.1 的 build 系统会读 `java -version` 的第一行做版本判断，
          # 所以这里既设 JAVA_HOME 也改 alternatives，双保险。
          JH=$(ls -d /usr/lib/jvm/temurin-8-jdk-* 2>/dev/null | head -1)
          echo "Java 8 安装路径: $JH"
          echo "JAVA_HOME=$JH" >> $GITHUB_ENV
          echo "$JH/bin" >> $GITHUB_PATH
          sudo update-alternatives --set java  "$JH/bin/java"  2>/dev/null || true
          sudo update-alternatives --set javac "$JH/bin/javac" 2>/dev/null || true
          sudo update-alternatives --set jar   "$JH/bin/jar"   2>/dev/null || true
          "$JH/bin/java" -version

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            python3-lib2to3

          # AOSP 8.1 自带的 prebuilt clang（4053586，2017 年构建）DT_NEEDED 里
          # 写死了 libncurses.so.5 / libtinfo.so.5，而 jammy 只剩 .so.6，
          # jammy 源里也没有 libncurses5 这个包了 —— 只能从 focal 的 pool 直接装。
          # 用 6.2-0ubuntu2.1（glibc 2.31 编的），比同目录下的 6.3 那几版更保险。
          BASE=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
          cd /tmp
          curl -sSLO "$BASE/libtinfo5_6.2-0ubuntu2.1_amd64.deb"
          curl -sSLO "$BASE/libncurses5_6.2-0ubuntu2.1_amd64.deb"
          sudo dpkg -i libtinfo5_6.2-0ubuntu2.1_amd64.deb libncurses5_6.2-0ubuntu2.1_amd64.deb

          # 同理：--gcc-toolchain 指向的 gcc 4.8 prebuilt 依赖 libmpfr.so.4，
          # jammy 只有 libmpfr6（.so.6）。从 bionic 的 pool 取。
          curl -sSLO "http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb"
          sudo dpkg -i libmpfr4_3.1.4-1_amd64.deb

          sudo ldconfig
          ldconfig -p | grep -E "lib(ncurses|tinfo)\.so\.5|libmpfr\.so\.4"

      - name: repo init and sync
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir -p $GITHUB_WORKSPACE/rom
          cd $GITHUB_WORKSPACE/rom
          git config --global user.name "phoenix-ci"
          git config --global user.email "ci@phoenix.local"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
                    -b twrp-8.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h /

      - name: Place device tree
        run: |
          mkdir -p rom/device/gionee/gbl7356
          rsync -a --exclude='.git' dt/ rom/device/gionee/gbl7356/
          ls -la rom/device/gionee/gbl7356/

      - name: Patch legacy python2 scripts
        run: |
          bash rom/device/gionee/gbl7356/tools/ci-patch-tree.sh rom

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Build recovery
        run: |
          cd rom
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPRESS=1
          ccache -z || true
          # 注意：不要设 _JAVA_OPTIONS / JAVA_TOOL_OPTIONS。
          # 它们会往 `java -version` 的 stderr 里插一行 "Picked up ..."，
          # 而 8.1 的 build 系统只读第一行来判断版本，会直接判成版本错误。
          set -o pipefail
          source build/envsetup.sh
          lunch omni_gbl7356-eng
          java -version 2>&1 | head -2
          # 先验证那个 2017 年的 prebuilt clang 能起来，别等编到一半才发现缺库
          prebuilts/clang/host/linux-x86/clang-4053586/bin/clang --version | head -2
          # 体积在源头（ci-patch-tree.sh 的 POST_INSTALL 清理）控制好，
          # mkbootfs 原生打包，绝不在产物上重打包 ramdisk。
          mka recoveryimage -j$(nproc --all) 2>&1 | tee ../build.log
          ccache -s || true

      - name: Verify native recovery image
        #  IMPORTANT: do NOT unpack/repack the ramdisk here.
        #  MTK 3.10 kernel refuses to mount a ramdisk repacked with
        #  GNU cpio ("VFS: Cannot open root device ram" -> panic).
        #  Slimming is done at source level in ci-patch-tree.sh via
        #  LOCAL_POST_INSTALL_CMD, so build/make's mkbootfs produces
        #  a kernel-acceptable ramdisk.
        if: always()
        run: |
          cd rom
          D=out/target/product/gbl7356
          if [ ! -f "$D/ramdisk-recovery.img" ] || [ ! -f "$D/kernel" ] || [ ! -f "$D/recovery.img" ]; then
            echo "::error::native build outputs missing - build failed earlier"
            exit 1
          fi
          echo "=== native build outputs (mkbootfs-packed, NOT repacked) ==="
          ls -l "$D/ramdisk-recovery.img" "$D/kernel" "$D/recovery.img"
          SIZE=$(stat -c%s "$D/recovery.img")
          MAX=$((16777216 - 270336))
          echo "recovery.img = $SIZE bytes, max = $MAX"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::native recovery.img too large - source-level slimming insufficient"
            exit 1
          fi
          echo "OK: native image fits with $((MAX-SIZE)) bytes spare"

      - name: Inspect ramdisk contents
        if: always()
        run: |
          D=rom/out/target/product/gbl7356
          [ -d "$D" ] || exit 0
          echo "=== 镜像与内核 ==="
          ls -lh "$D"/*.img "$D/kernel" 2>/dev/null || true
          echo "=== 最终 recovery.img header 校验 ==="
          python3 - <<'EOF'
          import struct
          try:
              d = open("rom/out/target/product/gbl7356/recovery.img", "rb").read(1664)
              assert d[:8] == b"ANDROID!", "bad magic"
              ks,ka,rs,ra,ss,sa,ta,ps = struct.unpack("<8I", d[8:40])
              print("kernel  %8d 0x%08x (期望 0x40080000)" % (ks,ka))
              print("ramdisk %8d 0x%08x (期望 0x44000000)" % (rs,ra))
              print("tags    %8d 0x%08x (期望 0x4e000000)" % (ss,ta))
              print("page    %8d (期望 2048)" % ps)
              print("cmdline:", d[64:576].split(b"\0")[0].decode())
          except Exception as e:
              print("header 校验失败:", e)
          EOF
          echo "=== 谁把这些文件放进了 ramdisk（排除开关失灵的根因）==="
          grep -E "bash|python|tzdata|f2fs" "$D/recovery/root/ramdisk-files.txt" 2>/dev/null | head -25 || true
          echo "=== recovery root 各子目录（未压缩）==="
          du -sh "$D"/recovery/root/* 2>/dev/null | sort -h | tail -15 || true
          echo "=== ramdisk 里最大的 40 个文件（未压缩字节, size=第5列）==="
          gzip -dc "$D/ramdisk-recovery.img" 2>/dev/null \
            | cpio -itv 2>/dev/null \
            | awk '$5 ~ /^[0-9]+$/ {printf "%10d  %s\n", $5, $9}' \
            | sort -n | tail -40 || true

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      # 产物侧验证：源码补丁是否真的落进了最终 ramdisk。
      # 光看 patch 步骤成功不够 —— 曾经出现过"补丁打了但没进镜像"的情况
      # （例如被后续 rm 掉、或路径写错）。这三项是用户明确报过的问题：
      #   中文可选      → twres/languages/zh_CN.xml 必须在
      #   中文不是方块  → twres/fonts/DroidSansFallback.ttf 必须在
      #   温度/电量可信  → data.cpp 里两处 phoenix 补丁标记必须在源码里
      - name: Verify i18n and temp patch inside ramdisk
        if: always()
        run: |
          set -uo pipefail
          D=rom/out/target/product/gbl7356
          RD="$D/ramdisk-recovery.img"
          if [ ! -f "$RD" ]; then
            echo "::error::ramdisk-recovery.img 不存在，无法验证"
            exit 1
          fi
          echo "=== ramdisk 里的语言包与字体 ==="
          # ramdisk-recovery.img 是 gzip 压缩的 cpio，直接解压后按名字查
          tmp=$(mktemp -d)
          gzip -dc "$RD" > "$tmp/rd.cpio" 2>/dev/null || cp "$RD" "$tmp/rd.cpio"
          python3 - "$tmp/rd.cpio" <<'PYEOF'
          import sys
          raw = open(sys.argv[1], 'rb').read()
          names = []
          i = 0
          while True:
              j = raw.find(b'070701', i)
              if j < 0:
                  break
              h = raw[j:j+110]
              try:
                  namesize = int(h[94:102], 16)
                  filesize = int(h[54:62], 16)
              except ValueError:
                  break
              name = raw[j+110:j+110+namesize-1].decode('utf-8', 'replace')
              names.append((name, filesize))
              i = j + 110 + namesize
              i = (i + 3) & ~3
              i += filesize
              i = (i + 3) & ~3
              if name == 'TRAILER!!!':
                  break
          want = {
              'twres/languages/en.xml': None,
              'twres/languages/zh_CN.xml': None,
              'twres/fonts/DroidSansFallback.ttf': None,
          }
          have = dict(names)
          bad = []
          for k in want:
              if k in have:
                  print('  OK   %-38s %9d B' % (k, have[k]))
              else:
                  print('  MISS %-38s' % k)
                  bad.append(k)
          # 语言包不要太多，否则挤爆 16MB 分区
          langs = [n for n, _ in names if n.startswith('twres/languages/') and n.endswith('.xml')]
          print('  twres/languages 共 %d 个: %s' % (len(langs), ', '.join(sorted(langs))))
          if len(langs) > 4:
              print('  WARN 语言包过多（%d），注意 16MB 分区余量' % len(langs))
          if bad:
              print('::error::ramdisk 缺少关键文件: %s' % ', '.join(bad))
              sys.exit(1)
          print('OK: i18n 资源齐全')
          PYEOF
          rm -rf "$tmp"

          echo "=== 源码里的温度/电量补丁标记 ==="
          for m in "phoenix cpu_temp autodetect" "phoenix battery fallback"; do
            if grep -q "$m" rom/bootable/recovery/data.cpp; then
              echo "  OK   $m"
            else
              echo "::error::data.cpp 缺少补丁标记: $m"
              exit 1
            fi
          done
          echo "=== 编译期宏是否生效 ==="
          grep -m1 'TW_DEFAULT_LANGUAGE' rom/out/target/product/gbl7356/obj/ETC/*/intermediates/* 2>/dev/null || true
          echo "OK: i18n/temp 验证通过"

      # adb shell / 终端可用 + /data 可读的源码级修复是否真的进了 ramdisk。
      # 逐项查：/system/bin/sh 必须存在且 0755、file_contexts 有 shell_exec
      # 规则、init.rc 有 restorecon、/sbin 目录 0755。少一项 adb shell 就废。
      - name: Verify adb shell and data fix inside ramdisk
        if: always()
        run: |
          set -uo pipefail
          D=rom/out/target/product/gbl7356
          RD="$D/ramdisk-recovery.img"
          if [ ! -f "$RD" ]; then
            echo "::error::ramdisk-recovery.img 不存在，无法验证"
            exit 1
          fi
          tmp=$(mktemp -d)
          gzip -dc "$RD" > "$tmp/rd.cpio" 2>/dev/null || cp "$RD" "$tmp/rd.cpio"
          python3 - "$tmp/rd.cpio" <<'PYEOF'
          import sys
          raw = open(sys.argv[1], 'rb').read()
          entries = {}
          i = 0
          while True:
              j = raw.find(b'070701', i)
              if j < 0:
                  break
              h = raw[j:j+110]
              try:
                  mode = int(h[14:22], 16)
                  namesize = int(h[94:102], 16)
                  filesize = int(h[54:62], 16)
              except ValueError:
                  break
              name = raw[j+110:j+110+namesize-1].decode('utf-8', 'replace')
              data = raw[j+110+namesize:j+110+namesize+filesize]
              entries[name] = (mode, data)
              i = j + 110 + namesize
              i = (i + 3) & ~3
              i += filesize
              i = (i + 3) & ~3
              if name == 'TRAILER!!!':
                  break
          def mode_of(name):
              return entries.get(name, (0, b''))[0] & 0o777
          def text_of(name):
              return entries.get(name, (0, b''))[1].decode('utf-8', 'replace')
          bad = []
          checks = [
              ('/system/bin/sh 存在', 'system/bin/sh' in entries),
              ('/system/bin/sh 0755', mode_of('system/bin/sh') == 0o755),
              ('/sbin 目录 0755', mode_of('sbin') == 0o755),
              ('file_contexts 有 shell_exec 规则',
               'shell_exec' in text_of('file_contexts')),
              ('init.rc 有 restorecon',
               'restorecon' in text_of('init.rc')),
              ('init.rc 有 adb-data 标记',
               'phoenix-adbdata' in text_of('init.rc')),
          ]
          for label, ok in checks:
              print(('  OK   ' if ok else '  MISS ') + label)
              if not ok:
                  bad.append(label)
          if bad:
              print('::error::adb/data 修复未进 ramdisk: %s' % ', '.join(bad))
              sys.exit(1)
          print('OK: adb shell / data 修复齐全')
          PYEOF
          rm -rf "$tmp"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp rom/out/target/product/gbl7356/recovery.img artifacts/ 2>/dev/null || true
          cp rom/out/target/product/gbl7356/recovery.img artifacts/twrp-gbl7356.img 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-gbl7356
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
