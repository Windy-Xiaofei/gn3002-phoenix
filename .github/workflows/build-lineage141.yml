name: LineageOS 14.1

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ninja 目标：bootimage 只打 boot.img（含 sepolicy/ramdisk，验证 SELinux 用这个，快很多）；systemimage 全量'
        required: false
        default: systemimage
  push:
    branches: [ main ]
    paths:
      - 'device.mk'
      - 'lineage.mk'
      - 'AndroidProducts.mk'
      - 'BoardConfig.mk'
      - 'blobs/**'
      - 'rootdir/**'
      - 'configs/**'
      - 'overlay/**'
      - 'sepolicy/**'
      # 注意是 141 自己的文件名。之前复制自 15.1，指向 build-lineage.yml，
      # 结果改这个文件本身不会触发构建。
      - '.github/workflows/build-lineage141.yml'

concurrency:
  # 不能和 15.1 共用 `lineage-` 前缀：那样两边会互相 cancel-in-progress。
  group: lineage141-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: dt
          fetch-depth: 1
          # 设备树在 cm-14.1 分支上（工作流本身必须在 main 才能被 gh 识别）
          ref: cm-14.1

      # 再取一份 main 的 ramdisk 关键文件作为唯一真相源。
      # 背景：设备树从 cm-14.1 取，但 init.mt6735.rc / fstab.mt6735 这类
      # 开机链关键文件一旦两个分支不一致，就会出现「本地验证过的镜像和 CI 产出的
      # 不是一回事」，排查时非常费时间（已经踩过）。
      # 这里用 main（= 触发本次构建的 ref）覆盖 4 个文件：
      #   rootdir/init.mt6735.rc   设备 init 规则（含 on early-fs 挂 /cache）
      #   rootdir/fstab.mt6735     裸设备 fstab
      #   rootdir/ueventd.mt6735.rc 设备节点权限（/dev/mali0 等 GPU 节点必须 system:graphics）
      #   rootdir/sbin/bootlog.sh  开机日志落盘脚本
      #   device.mk                需要带 root/sbin/bootlog.sh 的 PRODUCT_COPY_FILES
      # 文件不存在时只告警不失败（旧分支触发时 main 上可能还没有这些文件）。
      - name: Checkout authoritative ramdisk files (main)
        uses: actions/checkout@v4
        with:
          path: dtmain
          fetch-depth: 1
          ref: main
        continue-on-error: true

      # LineageOS 全量源码 + out 目录大概 90GB，runner 的 84GB 盘必须尽量腾空。
      # 这些预装组件对 Android 编译毫无用处，删掉能多出 20GB 以上。
      - name: Free disk space
        run: |
          echo "--- 清理前 ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/lib/jvm/*11* /usr/lib/jvm/*17* /usr/lib/jvm/*21* 2>/dev/null || true
          sudo apt-get clean
          echo "--- 清理后 ---"; df -h /

      - name: Install Java 8
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -qq
          sudo apt-get install -y temurin-8-jdk
          JH=$(ls -d /usr/lib/jvm/temurin-8-jdk-* 2>/dev/null | head -1)
          echo "JAVA_HOME=$JH" >> $GITHUB_ENV
          echo "$JH/bin" >> $GITHUB_PATH
          sudo update-alternatives --set java  "$JH/bin/java"  2>/dev/null || true
          sudo update-alternatives --set javac "$JH/bin/javac" 2>/dev/null || true
          "$JH/bin/java" -version

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2.7 git-lfs \
            lib32z1-dev lib32ncurses-dev lib32readline-dev

          # AOSP 8.1 的 prebuilt clang（4053586）DT_NEEDED 里写死 libncurses.so.5 /
          # libtinfo.so.5，jammy 只剩 .so.6，只能从 focal 的 pool 取。
          BASE=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
          cd /tmp
          curl -sSLO "$BASE/libtinfo5_6.2-0ubuntu2.1_amd64.deb"
          curl -sSLO "$BASE/libncurses5_6.2-0ubuntu2.1_amd64.deb"
          sudo dpkg -i libtinfo5_6.2-0ubuntu2.1_amd64.deb libncurses5_6.2-0ubuntu2.1_amd64.deb || true
          curl -sSLO "http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb"
          sudo dpkg -i libmpfr4_3.1.4-1_amd64.deb || true
          sudo ldconfig

          # external/chromium-webview/prebuilt/arm64 这份 APK 在 LineageOS 那边
          # 是用 Git LFS 存的（.gitattributes: *.apk filter=lfs，文件本身只有
          # 134 字节的指针）。没有 git-lfs 时 checkout 下来就是那串文本，
          # 一直混到 80% 才由 signapk 报 "error in opening zip file"。
          # --skip-repo 把 filter 写进 ~/.gitconfig，后面的 repo sync checkout
          # 才会真的去 review.lineageos.org 拉对象。
          git lfs install --skip-repo
          git lfs version

      - name: repo init and sync
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir -p $GITHUB_WORKSPACE/rom
          cd $GITHUB_WORKSPACE/rom
          git config --global user.name "gn3002-ci"
          git config --global user.email "ci@gn3002.local"
          git config --global color.ui false

          # --depth=1 只拉当前提交，能把 .repo 从 ~40GB 压到 ~15GB
          repo init -u https://github.com/CyanogenMod/android.git -b cm-14.1 --depth=1
          # repo sync 是网络 I/O 密集，不是 CPU 密集：实测 nproc=4 的 runner 上
          # -j8（旧值 nproc+4）要 196s。提到 -j16 让更多 git 并行下载，
          # 4 核完全喂得饱 16 路网络请求；--fail-fast 让失败立刻暴露不空等。
          repo sync -c -j16 --force-sync --no-clone-bundle --no-tags --optimized-fetch --fail-fast
          df -h /




      - name: Place device tree
        run: |
          mkdir -p rom/device/gionee/gbl7356
          rsync -a --exclude='.git' dt/ rom/device/gionee/gbl7356/

          # main 上的关键文件覆盖过来（见上面 "Checkout authoritative
          # ramdisk files" 的说明）。CM-14.1 分支上这些文件可能是旧版。
          echo "--- 用 main 覆盖 ramdisk 关键文件 ---"
          for f in rootdir/init.mt6735.rc rootdir/fstab.mt6735 \
                   rootdir/ueventd.mt6735.rc \
                   rootdir/sbin/bootlog.sh device.mk; do
            if [ -f "dtmain/$f" ]; then
              mkdir -p "rom/device/gionee/gbl7356/$(dirname $f)"
              cp -a "dtmain/$f" "rom/device/gionee/gbl7356/$f"
              echo "  已覆盖 $f"
            else
              echo "  警告: dtmain/$f 不存在，沿用 cm-14.1 的版本"
            fi
          done

          # blobs/ 也要用 main 的：设备树本体从 cm-14.1 检出，但新增的闭源库
          # （以及 blobs.mk 里的拷贝规则）只在 main 上。
          # 2026-11-28 踩过：补了 5 个显示栈依赖库并提交到 main，CI 却仍用
          # cm-14.1 的 blobs（86 MB），产物里一个都没进去，白跑一轮 30 分钟。
          echo "--- 用 main 覆盖 blobs 与 blobs.mk ---"
          if [ -d dtmain/blobs ]; then
            rsync -a --delete dtmain/blobs/ rom/device/gionee/gbl7356/blobs/
            echo "  已覆盖 blobs/（$(du -sh rom/device/gionee/gbl7356/blobs | cut -f1)）"
          else
            echo "  警告: dtmain/blobs 不存在，沿用 cm-14.1 的 blobs"
          fi

          # 校验：显示栈依赖库必须齐（缺了 surfaceflinger 会 SIGABRT）
          # libpq_prot.so 是递归展开依赖链才发现的第三层：
          #   surfaceflinger -> libGLES_mali.so -> libdpframework.so -> libpq_prot.so
          echo "--- 校验显示栈依赖库 ---"
          for l in libion.so libbwc.so libgui_ext.so libui_ext.so \
                   libperfservicenative.so libstlport.so libpq_prot.so; do
            for d in lib lib64; do
              p="rom/device/gionee/gbl7356/blobs/$d/$l"
              if [ -f "$p" ]; then
                echo "  OK   $d/$l"
              else
                echo "::error::缺少 blobs/$d/$l（显示栈依赖，surfaceflinger 会崩）"
                exit 1
              fi
            done
          done

          echo "--- device tree ---"
          ls -la rom/device/gionee/gbl7356/
          du -sh rom/device/gionee/gbl7356/blobs 2>/dev/null || echo "警告: blobs 缺失"

      # 上一轮在 80% 挂了两个半小时才报错，就因为这个 APK 是 LFS 指针。
      # 在这里先验一遍，拉不动就立刻停，别再烧一轮。
      - name: Ensure webview prebuilt
        run: |
          WV="$GITHUB_WORKSPACE/rom/external/chromium-webview/prebuilt/arm64/webview.apk"
          ls -l "$WV" || echo "webview.apk 不存在"
          SZ=$(stat -c %s "$WV" 2>/dev/null || echo 0)
          echo "当前大小: $SZ 字节"
          if [ "$SZ" -lt 1000000 ]; then
            echo "--- 还是 LFS 指针，手动拉一次 ---"
            cat "$WV" || true
            cd "$(dirname "$WV")"
            git lfs install --local
            git lfs pull
            SZ=$(stat -c %s "$WV")
            echo "拉取后大小: $SZ 字节"
          fi
          if [ "$SZ" -lt 1000000 ]; then
            echo "FATAL: webview.apk 仍是指针"; exit 1
          fi

      # 补 cmsdk 的跨模块依赖边（根本原因，见 Build 步骤里的长注释）。
      # 只改 CI 里 repo sync 出来的源码，不碰仓库设备树。内联 Python 而不是
      # 引用 ci/ 下的脚本：这个 workflow 用 ref: cm-14.1 checkout 设备树，
      # main 分支新增的 ci/ 脚本 runner 上根本看不到。
      - name: Patch source trees (cmsdk + netd)
        run: |
          python3 - <<'PYEOF'
          import os, sys

          ROM = os.environ.get('GITHUB_WORKSPACE', '.') + '/rom'

          # ---- 补丁 1: cmsdk 跨模块 R.java 依赖边 ----------------------------
          p = ROM + '/vendor/cmsdk/Android.mk'
          if os.path.isfile(p):
              s = open(p, encoding='utf-8', errors='surrogateescape').read()
              mark = '# [gn3002] internal R.java dep fix'
              if mark in s:
                  print('[cmsdk] 已打过补丁，跳过')
              else:
                  # 必须从 internal 的 LOCAL_MODULE 往后找它自己的 include，
                  # platform 模块里也有同名的 full_target 规则。
                  # 关键：插在 BUILD_STATIC_JAVA_LIBRARY 的 include **之后**——
                  # full_classes_jack 等变量在那个 include 里才定义。
                  a = s.find('LOCAL_MODULE:= org.cyanogenmod.platform.internal')
                  inc = 'include $(BUILD_STATIC_JAVA_LIBRARY)'
                  j = s.find(inc, a) if a >= 0 else -1
                  if j < 0:
                      print('[cmsdk] 警告: 找不到 internal 模块的 include，跳过')
                  else:
                      j += len(inc)
                      block = (
                          mark + '\n'
                          'cm_internal_res_R_stamp := $(call intermediates-dir-for,APPS,org.cyanogenmod.platform-res,,COMMON)/src/R.stamp\n'
                          '$(full_classes_jack): $(cm_internal_res_R_stamp)\n'
                          '$(noshrob_classes_jack): $(cm_internal_res_R_stamp)\n'
                          '$(full_classes_compiled_jar): $(cm_internal_res_R_stamp)\n'
                          '$(built_dex_intermediate): $(cm_internal_res_R_stamp)\n'
                      )
                      open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s[:j] + '\n' + block + s[j:])
                      print('[cmsdk] 已补依赖边: ' + p)
          else:
              print('[cmsdk] 警告: 找不到 ' + p)

          # ---- 补丁 2: netd 条件编译 bug ------------------------------------
          # CM 14.1 源码不一致：SoftapController.h 里双参数 startSoftap 重载
          # 被 #ifdef LIBWPA_CLIENT_EXISTS 包住（由 WPA_SUPPLICANT_VERSION 决定），
          # 单参数版则在 #else。而 MTK 设备这两个宏都没开，导致：
          #   (a) CommandListener.cpp #else 分支无条件调用 startSoftap(false, cli)
          #       -> too many arguments (expected at most single argument)
          #   (b) SoftapController.cpp 的定义还是 startSoftap(bool, SocketClient*=NULL)
          #       -> out-of-line definition does not match any declaration
          # 函数体里唯一用到 socketClient 的那行也在 #ifdef 内，无该宏时是死参数。
          # 所以调用方去掉 cli、定义方去掉 socketClient 即可，两处必须同时改。
          cl = ROM + '/system/netd/server/CommandListener.cpp'
          if os.path.isfile(cl):
              s = open(cl, encoding='utf-8', errors='surrogateescape').read()
              old = 'gCtls->softapCtrl.startSoftap(false, cli)'
              new = 'gCtls->softapCtrl.startSoftap(false)'
              if old in s:
                  s = s.replace(old, new)
                  open(cl, 'w', encoding='utf-8', errors='surrogateescape').write(s)
                  print('[netd] 调用方去掉 cli: ' + cl)
              else:
                  print('[netd] 调用方已是新写法，跳过')
          else:
              print('[netd] 警告: 找不到 ' + cl)

          sc = ROM + '/system/netd/server/SoftapController.cpp'
          if os.path.isfile(sc):
              s = open(sc, encoding='utf-8', errors='surrogateescape').read()
              old = 'int SoftapController::startSoftap(bool global_ctrl_iface, SocketClient *socketClient = NULL) {'
              new = 'int SoftapController::startSoftap(bool global_ctrl_iface) {'
              if old in s:
                  s = s.replace(old, new)
                  open(sc, 'w', encoding='utf-8', errors='surrogateescape').write(s)
                  print('[netd] 定义方去掉 socketClient: ' + sc)
              else:
                  print('[netd] 定义方已是新写法，跳过')
          else:
              print('[netd] 警告: 找不到 ' + sc)

          # ---- 补丁 2b: 校验 init.mt6735.rc 的挂载链完整性 --------------------
          # 7.1 的挂载分工和前几版理解都不一样，最终结论（三个来源交叉确认）：
          #   1. AOSP /init.rc 的 on fs 段里只有**注释**
          #        # Mount fstab in init.{$device}.rc by mount_all command.
          #      所以必须由设备 rc 调 mount_all —— 两边都不写就谁都没挂。
          #   2. mount_all 失败 = 沉默卡第一屏：只有它正常返回
          #      FS_MGR_MNTALL_DEV_NOT_ENCRYPTABLE，init 才 queue "nonencrypted"，
          #      而 class_start main（zygote/servicemanager/surfaceflinger 都在
          #      main 类）就在那个动作里。所以 rc 里 mount_all 必须是 on fs 第一条，
          #      前面不许有任何可能失败的命令。
          #   3. /cache 由 on early-fs 自己挂（要先建可观测通道，把上一轮
          #      last_kmsg 抢救进持久分区），所以 fstab 里不能再有 cache 行。
          # 这里不再"补"文件内容（main 的权威版本已经覆盖过来），只做校验：
          # 缺任何一项就 fail，别让一个静默卡第一屏的镜像又被刷进手机。
          ir = ROM + '/device/gionee/gbl7356/rootdir/init.mt6735.rc'
          if os.path.isfile(ir):
              s = open(ir, encoding='utf-8', errors='surrogateescape').read()
              # 只认**生效行**：本文件注释里大段解释挂载链，用 `in s` 判断
              # 会被注释骗过（本项目在 POLICYVERS 上已经踩过一次同样的坑）。
              active = [ln.split('#', 1)[0].rstrip() for ln in s.split('\n')]
              active_txt = '\n'.join(active)
              checks = [
                  ('on early-fs', '早挂 /cache 的动作'),
                  ('/dev/block/mmcblk0p21 /cache',
                   'early-fs 里挂 /cache（mount ext4 /dev/block/mmcblk0p21 /cache wait）'),
                  ('mount_all /fstab.mt6735', 'mount_all（7.1 唯一挂载入口）'),
                  ('service bootlog', '开机日志落盘服务'),
              ]
              bad = [(k, d) for k, d in checks if k not in active_txt]
              if bad:
                  for k, d in bad:
                      print('[init] 缺项: %s -> %s' % (d, k))
                  sys.exit('[init] init.mt6735.rc 不完整，拒绝构建')
              # mount_all 必须排在 on fs 段的第一条（前面不能有可失败命令）
              fs_sec = (active_txt.split('on fs\n', 1)[1].split('\non ', 1)[0]
                        if 'on fs\n' in active_txt else '')
              first = next((ln.strip() for ln in fs_sec.split('\n') if ln.strip()), '')
              if not first.startswith('mount_all'):
                  sys.exit('[init] on fs 段第一条命令是 %r，必须是 mount_all' % first)
              # 可能失败的命令（mount/mkdir）必须放在 AOSP 没定义的独占 trigger 里。
              # 原因：init 同一 trigger 下前一条命令失败会中止后面所有命令，而本文件
              # 在 init.rc 第 9 行就被 import，同名 trigger 的命令排在 AOSP 命令前面
              # —— 若失败，AOSP 的 start logd / start vold 会被一起跳过。
              # AOSP init.rc 里没有定义的段：early-fs / fs / late-fs / early-boot。
              exclusive = ('early-fs', 'fs', 'late-fs', 'early-boot')
              shared_bad = []
              cur = None
              for ln in active_txt.split('\n'):
                  t = ln.strip()
                  if not t:
                      continue
                  if t.startswith('on '):
                      cur = t[3:].split()[0] if len(t) > 3 else ''
                      continue
                  if cur in exclusive:
                      continue
                  cmd = t.split()[0]
                  if cmd in ('mount', 'mount_all', 'mkdir', 'chmod', 'chown',
                             'copy', 'exec', 'swapon_all', 'restorecon',
                             'restorecon_recursive'):
                      shared_bad.append((cur, t))
              if shared_bad:
                  for sec, t in shared_bad:
                      print('[init] 共享 trigger "%s" 里有可失败命令: %s' % (sec, t))
                  sys.exit('[init] 可失败命令必须放进 early-fs/fs/late-fs/early-boot '
                           '独占段，否则会连带跳过 AOSP 的 start logd/vold')
              print('[init] 挂载链校验通过（early-fs 挂 cache + fs 首条 mount_all + '
                    'late-fs 兜底 + bootlog；可失败命令均在独占 trigger）')
          else:
              sys.exit('[init] 找不到 ' + ir)

          # ---- 补丁 2c: 校验 fstab 用裸设备路径 ------------------------------
          # 实测 last_kmsg: mount_all 已执行，但
          #   fs_mgr: Failed to mount ... on /dev/block/platform/mtk-msdc.0/by-name/system
          #           at /system ... error: No such file or directory
          # 根因（AOSP android-7.1.1_r6 init/devices.cpp 源码确认）：
          #   get_block_device_symlinks() 只有 uevent 带 PARTNAME= 才建 by-name 软链，
          #   这颗 MTK 3.10 内核不吐 PARTNAME=，所以 /dev/block/platform 整个不存在；
          #   而 handle_block_device_event() 对每个块设备无条件建 /dev/block/<name>。
          # 分区号交叉验证：
          #   p20 = 0xC0000000 = scatter 里 system 的 partition_size（3GB）
          #   p21 = cache、p22 = userdata（TWRP /proc/mounts 实测）
          fb = ROM + '/device/gionee/gbl7356/rootdir/fstab.mt6735'
          if os.path.isfile(fb):
              s = open(fb, encoding='utf-8', errors='surrogateescape').read()
              # 只看**生效行**，不看注释：这份 fstab 的注释里大段解释 by-name
              # 为什么不存在，用 `'by-name' in s` 判断会误报（这类误判本项目
              # 已经踩过一次，见 POLICYVERS 那条教训）。
              active = [ln.split('#', 1)[0].strip()
                        for ln in s.split('\n')]
              active = [ln for ln in active if ln]
              if any('by-name' in ln for ln in active):
                  sys.exit('[fstab] 生效行里还有 by-name 路径，7.1 上必然 ENOENT')
              joined = '\n'.join(active)
              for need in ('/dev/block/mmcblk0p20', '/system',
                           '/dev/block/mmcblk0p22', '/data'):
                  if need not in joined:
                      sys.exit('[fstab] 生效行里缺少 %s' % need)
              # /cache 必须**留在** fstab 里（B17 实测教训，与早期结论相反）：
              # 曾把 /cache 从 fstab 删掉、只靠 init 的 on early-fs 显式 mount，
              # 结果那次 mount 失败时完全静默（init 的 mount 命令不打日志），
              # 导致整个启动过程 /cache 从未挂载，checkpoint 与 bootlog 的日志
              # 全落进 ramdisk 内存目录、重启即失。
              # 现在双保险：early-fs 先试一次，fstab 这里再由 fs_mgr 挂。
              # 二次挂载拿 EBUSY 也不致命 —— 因为带 nofail，不计入 error_count。
              cache_row = None
              for ln in active:
                  parts = ln.split()
                  if len(parts) >= 5 and parts[1] == '/cache':
                      cache_row = parts
              if cache_row is None:
                  sys.exit('[fstab] 缺少 /cache 条目；B17 实测：/cache 必须留在 '
                           'fstab 里，靠 nofail 兜住二次挂载的 EBUSY')
              if 'nofail' not in cache_row[4]:
                  sys.exit('[fstab] /cache 缺 nofail：二次挂载拿 EBUSY 会让 '
                           'error_count++ 进而 mount_all 返回 -1')
              # system / data 必须带 nofail（B15）：fs_mgr.c 里没写 nofail 的分区
              # 挂不上会 ++error_count，mount_all 返回 -1；init 收到 255 只打一句
              # "unexpected error"，不 queue "nonencrypted"，而 class_start main
              # （zygote / servicemanager / surfaceflinger）就在那里 -> 静默卡第一屏。
              # 写了 nofail 则只打 "Ignoring failure"，mount_all 返回 0，启动链不断。
              for ln in active:
                  parts = ln.split()
                  if len(parts) >= 5 and parts[1] in ('/system', '/data'):
                      if 'nofail' not in parts[4]:
                          sys.exit('[fstab] %s 缺 nofail：该分区挂不上会拖死整个 '
                                   'mount_all，zygote 永不启动' % parts[1])
              print('[fstab] 校验通过：裸设备 p20=system / p22=data，'
                    '均带 nofail，无 cache 行')
          else:
              sys.exit('[fstab] 找不到 ' + fb)


          # ---- 补丁 3: sepolicy v29（3.10 内核只支持 15-29）------------------
          # CM 14.1 的 checkpolicy 默认产出 sepolicy v30，MTK 3.10 内核只支持
          # 15-29，开机 init 报 "policydb version 30 does not match my version
          # range 15-29" -> Security failure -> 重启进 recovery。
          # 设 POLICYVERS := 29 让 checkpolicy 产出 v29。
          bc = ROM + '/device/gionee/gbl7356/BoardConfig.mk'
          if os.path.isfile(bc):
              s = open(bc, encoding='utf-8', errors='surrogateescape').read()
              # 注意：不能用 `'POLICYVERS' in s` 判断——cm-14.1 的 BoardConfig
              # 注释里大段提到 POLICYVERS（解释为什么不需要设），会导致误判跳过。
              # 必须找真正生效的赋值行（行首 POLICYVERS，允许前导空白）。
              import re
              # 匹配整行赋值（含数值），只认行首的赋值，跳过注释行
              m = re.search(r'(?m)^(\s*POLICYVERS\s*:?=\s*)(\d+)(\s*(?:#.*)?)$', s)
              if m:
                  old = m.group(2)
                  if old == '29':
                      print('[board] POLICYVERS 已是 29，跳过')
                  else:
                      s = s[:m.start()] + m.group(1) + '29' + m.group(3) + s[m.end():]
                      open(bc, 'w', encoding='utf-8', errors='surrogateescape').write(s)
                      print('[board] 覆盖 POLICYVERS %s -> 29' % old)
              else:
                  s += ('\n# [gn3002] 3.10 内核只支持 policy v15-29，默认 v30 开不了机\n'
                        'POLICYVERS := 29\n')
                  open(bc, 'w', encoding='utf-8', errors='surrogateescape').write(s)
                  print('[board] 已加 POLICYVERS := 29: ' + bc)
          else:
              print('[board] 警告: 找不到 ' + bc)

          # ---- 补丁 4: libsepol 写 v29 时丢弃 xperm 节点 ---------------------
          # v29 下 libsepol 遇到 xperm(ioctl extended perms, v30 特性) 条目会报
          # "policy version 29 does not support ioctl extendedpermissions rules"。
          # 即使强改成 v29，内核 avtab reader 也不认 xperm 的 specified 位，报
          # "avtab: more than one specifier"。所以必须在写 avtab 前摘除 xperm 节点。
          # 注意锚点与 8.1 不同：7.1 的 avtab_write 里 nel=cpu_to_le32(a->nel)
          # 在写循环之前，必须在那之前摘节点并重算 a->nel。
          wc = ROM + '/external/selinux/libsepol/src/write.c'
          if os.path.isfile(wc):
              s = open(wc, encoding='utf-8', errors='surrogateescape').read()
              if 'gn3002 v29 xperm fix' in s:
                  print('[libsepol] 已打过补丁，跳过')
              else:
                  anchor = ('\t} else {\n'
                            '\t\t/* New avtab format.  nel is good to go. */\n'
                            '\t\tnel = cpu_to_le32(a->nel);')
                  fix = ('\t} else {\n'
                         '\t\t/* [gn3002 v29 xperm fix] 目标内核 v29 无 xperm，先摘除 */\n'
                         '\t\tif (p->policyvers < POLICYDB_VERSION_XPERMS_IOCTL) {\n'
                         '\t\t\tfor (i = 0; i < a->nslot; i++) {\n'
                         '\t\t\t\tavtab_ptr_t *pp = &a->htable[i];\n'
                         '\t\t\t\twhile (*pp) {\n'
                         '\t\t\t\t\tif ((*pp)->key.specified & AVTAB_XPERMS) {\n'
                         '\t\t\t\t\t\t*pp = (*pp)->next;\n'
                         '\t\t\t\t\t\ta->nel--;\n'
                         '\t\t\t\t\t} else {\n'
                         '\t\t\t\t\t\tpp = &(*pp)->next;\n'
                         '\t\t\t\t\t}\n'
                         '\t\t\t\t}\n'
                         '\t\t\t}\n'
                         '\t\t}\n'
                         '\t\t/* New avtab format.  nel is good to go. */\n'
                         '\t\tnel = cpu_to_le32(a->nel);')
                  if anchor not in s:
                      print('[libsepol] 警告: 找不到 avtab_write 锚点，跳过')
                  else:
                      s = s.replace(anchor, fix, 1)
                      open(wc, 'w', encoding='utf-8', errors='surrogateescape').write(s)
                      print('[libsepol] 已摘除 xperm 节点: ' + wc)
          else:
              print('[libsepol] 警告: 找不到 ' + wc)
          PYEOF
          echo "--- 补丁结果 ---"
          grep -n -A2 'internal R.java dep fix' "$GITHUB_WORKSPACE/rom/vendor/cmsdk/Android.mk" || true
          grep -n 'startSoftap(false' "$GITHUB_WORKSPACE/rom/system/netd/server/CommandListener.cpp" || true

      # 用 restore/save 拆开写，不用 actions/cache@v4 的自动保存：
      # 自动保存只在 job 成功时才写，而我们现在每轮都挂在半路，
      # 于是 "Post Setup ccache" 每次都是 skipped，缓存从来没落过盘，
      # 每轮都在零缓存冷编 —— 这是整轮两小时半的主因。
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-lineage-${{ github.run_id }}
          restore-keys: |
            ccache-lineage-

      - name: Build system image
        run: |
          cd rom
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          # 提速：缓存拉到 9G。ccache 命中率已 99%，上一轮缓存涨到 4.82G
          # 就满了，再大些能多留一轮的编译结果。
          export CCACHE_MAXSIZE=9G
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=3
          # ccache 默认用「编译器文件的 mtime」判断编译器是否变过，而每次
          # CI 都是全新 checkout，prebuilts 里 clang 的 mtime 每次都不同，
          # 于是全部判为「换了编译器」，缓存直接失效。content 改成按内容哈希。
          export CCACHE_COMPILERCHECK=content
          # 头文件 mtime 在全新 checkout 里必然变，但内容没变，别让它影响命中
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          export CCACHE_BASEDIR=$(pwd)
          export ALLOW_MISSING_DEPENDENCIES=true
          # 跳过 API 兼容性检查。
          # 7.1 的 build/core/tasks/apicheck.mk:21 是
          #     ifeq (,$(filter true, $(WITHOUT_CHECK_API) $(TARGET_BUILD_PDK)))
          # 设了 ONLY_WITHOUT_CHECK_API 就整段跳过。
          #
          # 不设的后果（run 44911915786）：
          #   ninja: error: '/7.txt', needed by
          #   '.../PACKAGING/checkpublicapi-cm-last-timestamp',
          #   missing and no known rule to make it
          #
          # 原因是 apicheck.mk:28 这么算"最后发布的 SDK 版本"：
          #   last_released_sdk_version := $(lastword $(call numerically_sort, \
          #       $(patsubst $(SRC_API_DIR)/%.txt,%, $(wildcard $(SRC_API_DIR)/*.txt))))
          # 这套 manifest 下 txt 没拉全，算出空值，路径就成了 "/7.txt"。
          #
          # 我们不是要做过 CTS 的发行版，API 检查对自用移植没有意义。
          export WITHOUT_CHECK_API=true

          # 7.1 的构建脚本同样是 Python 2 语法（except X, e / print 语句）。
          # jammy 默认没有 python，python3 顶上就会 SyntaxError。装 python2.7 后
          # 让 `python` 指向它；/usr/local/bin 在 PATH 里排在 /usr/bin 前面。
          PY2=$(command -v python2.7 || command -v python2 || true)
          if [ -z "$PY2" ]; then echo "FATAL: 没有 python2，7.1 编不了"; exit 1; fi
          sudo ln -sf "$PY2" /usr/local/bin/python
          echo "python -> $(readlink -f /usr/local/bin/python)"; python --version
          echo "python3 -> $(command -v python3)"; python3 --version

          # ----- Jack ----------------------------------------------------------
          # 7.1 必须用 Jack（见 BoardConfig.mk 里的说明：非 Jack 路径没有
          # 生成 with-local/classes.dex 的规则）。
          #
          # 但 jack-admin 的服务端用 TLSv1 + 自签 JKS，而 Temurin 8u331 之后
          # 默认把 TLSv1 列入 jdk.tls.disabledAlgorithms，于是每次都在握手里死：
          #   Jack server failed to (re)start
          #   SSL error when connecting to the Jack server
          # 这里把它从禁用列表里摘掉。只影响这个一次性 CI 环境。
          JAVA_SEC=""
          for c in "$JAVA_HOME/jre/lib/security/java.security" \
                   "$JAVA_HOME/conf/security/java.security"; do
            if [ -f "$c" ]; then JAVA_SEC="$c"; break; fi
          done
          if [ -n "$JAVA_SEC" ]; then
            echo "修补 $JAVA_SEC 的 TLS 禁用列表"
            grep '^jdk.tls.disabledAlgorithms' "$JAVA_SEC" || true
            sudo sed -i 's/^jdk\.tls\.disabledAlgorithms=.*/jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL/' "$JAVA_SEC"
            grep '^jdk.tls.disabledAlgorithms' "$JAVA_SEC" || true
          else
            echo "警告: 找不到 java.security，Jack 可能会 TLS 握手失败"
          fi

          # Jack server 的堆内存。默认只给 1G 左右，7.1 全量编译的
          # 单个 Java 模块（framework、Settings 之类）会 OOM。
          # -Dfile.encoding 是 7.1 官方建议，避免中文资源乱码。
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"
          export JACK_SERVER=true
          echo "JACK_SERVER_VM_ARGUMENTS=$JACK_SERVER_VM_ARGUMENTS"

          ccache -z || true
          source build/envsetup.sh
          lunch lineage_gbl7356-userdebug

          # ----- 伪造 KERNEL_OBJ/usr -------------------------------------------
          # 7.1 的 libtinyalsa 等模块无条件依赖
          #   out/target/product/gbl7356/obj/KERNEL_OBJ/usr
          # 这个目录本来由 vendor/cm/build/tasks/kernel.mk 在
          #   ifeq ($(FULL_KERNEL_BUILD),true)
          # 块里生成（第 201 行定义 KERNEL_HEADERS_INSTALL，第 331 行给规则）。
          # 我们用的是 TARGET_PREBUILT_KERNEL（原厂内核，不改），于是
          # FULL_KERNEL_BUILD := false，那段规则整块不存在，ninja 报：
          #   ninja: error: '.../obj/KERNEL_OBJ/usr', needed by
          #   '.../libtinyalsa_intermediates/mixer.o', missing and no known rule
          #
          # ninja 对目录型依赖只检查存在性，所以建个空目录就够。
          # 这些模块真正需要的头文件由 bionic/kernel-headers（prebuilts）
          # 提供，不依赖这里。
          KOBJ=out/target/product/gbl7356/obj/KERNEL_OBJ
          mkdir -p "$KOBJ/usr/include" "$KOBJ/usr/arch"
          echo "已建 $KOBJ/usr（绕过 FULL_KERNEL_BUILD 的依赖）"
          ls -la "$KOBJ"
          # 默认全量 systemimage（boot.img 会顺带产出，systemimage 依赖
          # recovery_from_boot.p）。手动触发时可以填 bootimage 只打 boot.img，
          # 调 ramdisk / cmdline 时十几分钟就能出结果。
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then TARGET=systemimage; fi
          echo "编译目标: $TARGET"

          # 提速：4 核 runner 上用 -j8。Android 编译大量时间在等 IO/子进程，
          # 2 倍超配能明显缩短墙钟时间；16G 内存足够，不会 OOM。
          # 依赖边已在 "Patch source trees" 步骤修好，ninja 会自己排序生成
          # R.java，不需要再单独预构建（那一步白花 100 秒）。
          JOBS=$(( $(nproc --all) * 2 ))
          echo "并行度: $JOBS (nproc=$(nproc --all))"

          # 不要再接 `tail`：tail 要读完全部输入才输出，等于把 90k 行编译
          # 输出全憋到最后，网页上看就是卡住不动。这里改成实时透传——
          # 进度行（[ 12% 3456/90573]）每涨 2% 打一条，其余行原样输出，
          # 完整日志仍然落在 /tmp/build.log 供失败时分析。
          # 注意用 set +e 包住：GitHub 默认 shell 带 -e -o pipefail，
          # 不包的话 mka 一失败就当场退出，下面的失败诊断根本打印不出来。
          set +e
          mka $TARGET -j$JOBS 2>&1 \
            | stdbuf -oL tee /tmp/build.log \
            | awk 'BEGIN{last=-2} {if ($0 ~ /^\[ *[0-9]+%/) {match($0,/[0-9]+%/); p=substr($0,RSTART,RLENGTH-1)+0; if (p>=last+2) {print; fflush(); last=p} next} print; fflush()}'
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" != "0" ]; then
            echo "===== 失败目标清单 ====="
            grep -n "^FAILED:" /tmp/build.log | head -30 || true
            echo "===== 首个失败块的上下文 ====="
            awk '/^FAILED:/{c++} c==1' /tmp/build.log | head -50 || true
            echo "===== 日志末尾 ====="
            tail -40 /tmp/build.log
          fi
          ccache -s || true
          df -h /
          exit $rc

      - name: Package output
        if: always()
        run: |
          mkdir -p out_artifacts
          find rom/out/target/product/gbl7356 -maxdepth 1 \
               \( -name 'system.img' -o -name 'boot.img' -o -name '*.zip' \) \
               -exec cp {} out_artifacts/ \; 2>/dev/null || true
          ls -la out_artifacts/ || echo "没有产物"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-gbl7356-${{ github.run_number }}
          path: out_artifacts/
          if-no-files-found: warn
          retention-days: 7

      # 关键：if: always() —— 构建失败也要把 ccache 存下来，
      # 下一轮才有东西可复用。key 带 run_id 保证每次都新建条目。
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-lineage-${{ github.run_id }}
