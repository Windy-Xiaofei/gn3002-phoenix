name: LineageOS 15.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'device.mk'
      - 'lineage_gbl7356.mk'
      - 'BoardConfig.mk'
      - 'blobs/**'
      - 'rootdir/**'
      - 'configs/**'
      - 'overlay/**'
      - 'sepolicy/**'
      - '.github/workflows/build-lineage.yml'

concurrency:
  group: lineage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: dt
          fetch-depth: 1

      # LineageOS 全量源码 + out 目录大概 90GB，runner 的 84GB 盘必须尽量腾空。
      # 这些预装组件对 Android 编译毫无用处，删掉能多出 20GB 以上。
      - name: Free disk space
        run: |
          echo "--- 清理前 ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/lib/jvm/*11* /usr/lib/jvm/*17* /usr/lib/jvm/*21* 2>/dev/null || true
          sudo apt-get clean
          echo "--- 清理后 ---"; df -h /

      - name: Install Java 8
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -qq
          sudo apt-get install -y temurin-8-jdk
          JH=$(ls -d /usr/lib/jvm/temurin-8-jdk-* 2>/dev/null | head -1)
          echo "JAVA_HOME=$JH" >> $GITHUB_ENV
          echo "$JH/bin" >> $GITHUB_PATH
          sudo update-alternatives --set java  "$JH/bin/java"  2>/dev/null || true
          sudo update-alternatives --set javac "$JH/bin/javac" 2>/dev/null || true
          "$JH/bin/java" -version

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            lib32z1-dev lib32ncurses-dev lib32readline-dev

          # AOSP 8.1 的 prebuilt clang（4053586）DT_NEEDED 里写死 libncurses.so.5 /
          # libtinfo.so.5，jammy 只剩 .so.6，只能从 focal 的 pool 取。
          BASE=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
          cd /tmp
          curl -sSLO "$BASE/libtinfo5_6.2-0ubuntu2.1_amd64.deb"
          curl -sSLO "$BASE/libncurses5_6.2-0ubuntu2.1_amd64.deb"
          sudo dpkg -i libtinfo5_6.2-0ubuntu2.1_amd64.deb libncurses5_6.2-0ubuntu2.1_amd64.deb || true
          curl -sSLO "http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb"
          sudo dpkg -i libmpfr4_3.1.4-1_amd64.deb || true
          sudo ldconfig

      - name: repo init and sync
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          export PATH=~/bin:$PATH

          mkdir -p $GITHUB_WORKSPACE/rom
          cd $GITHUB_WORKSPACE/rom
          git config --global user.name "gn3002-ci"
          git config --global user.email "ci@gn3002.local"
          git config --global color.ui false

          # --depth=1 只拉当前提交，能把 .repo 从 ~40GB 压到 ~15GB
          repo init -u https://github.com/LineageOS/android.git -b lineage-15.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h /

      - name: Place device tree
        run: |
          mkdir -p rom/device/gionee/gbl7356
          rsync -a --exclude='.git' dt/ rom/device/gionee/gbl7356/
          echo "--- device tree ---"
          ls -la rom/device/gionee/gbl7356/
          du -sh rom/device/gionee/gbl7356/blobs 2>/dev/null || echo "警告: blobs 缺失"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lineage-${{ github.run_id }}
          restore-keys: |
            ccache-lineage-

      - name: Build system image
        run: |
          cd rom
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=8G
          export CCACHE_COMPRESS=1
          export ALLOW_MISSING_DEPENDENCIES=true
          ccache -z || true
          set -o pipefail
          source build/envsetup.sh
          lunch lineage_gbl7356-userdebug
          # 先只编 systemimage，不做 otapackage：出问题时报错更聚焦，
          # 也省掉 ~10GB 的中间产物
          mka systemimage -j$(nproc --all) 2>&1 | tail -200
          df -h /

      - name: Package output
        if: always()
        run: |
          mkdir -p out_artifacts
          find rom/out/target/product/gbl7356 -maxdepth 1 \
               \( -name 'system.img' -o -name 'boot.img' -o -name '*.zip' \) \
               -exec cp {} out_artifacts/ \; 2>/dev/null || true
          ls -la out_artifacts/ || echo "没有产物"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-gbl7356-${{ github.run_number }}
          path: out_artifacts/
          if-no-files-found: warn
          retention-days: 7
